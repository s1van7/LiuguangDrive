name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的版本标签，例如 v0.7.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 签名、校验并发布 APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取待发布代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查正式签名 Secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEYSTORE_BASE64" ] || { echo "::error::缺少 SIGNING_KEYSTORE_BASE64"; exit 1; }
          [ -n "$SIGNING_PASSWORD" ] || { echo "::error::缺少 SIGNING_PASSWORD"; exit 1; }
          [ -n "$SIGNING_ALIAS" ] || { echo "::error::缺少 SIGNING_ALIAS"; exit 1; }
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/liuguang-release.jks"
          chmod 600 "$RUNNER_TEMP/liuguang-release.jks"

      - name: 安装 Android 9 编译平台
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-28" "build-tools;34.0.0"

      - name: 运行纯 JVM 自检
        run: bash tests/run.sh

      - name: 构建正式签名 APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/liuguang-release.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: bash build.sh

      - name: 校验正式 APK
        id: apk
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' build.sh)
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          [ "$TAG" = "v$VERSION" ] || { echo "::error::标签 $TAG 与源码版本 v$VERSION 不一致"; exit 1; }
          APK="build/LiuguangDrive-$VERSION.apk"
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -q "versionName='$VERSION'"
          ! echo "$BADGING" | grep -q "android.permission.INTERNET"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee build/SHA256SUMS.txt
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.apk }}" build/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "流光车机音乐 ${{ steps.apk.outputs.tag }}" \
            --generate-notes
