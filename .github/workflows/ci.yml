name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 自检（纯 JVM，63 项断言）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 运行 tests/run.sh
        run: bash tests/run.sh

  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，但只有较新的平台。这里直接用 sdkmanager 补齐
      # android-28 与 build-tools 34.0.0，不依赖第三方 action。
      - name: 安装 platforms;android-28 与 build-tools;34.0.0
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null \
            || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-28" "build-tools;34.0.0"

          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: 构建（aapt → javac → d8 → zipalign → apksigner）
        run: bash build.sh

      - name: 校验产物
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APK=$(ls build/LiuguangDrive-*.apk | head -1)
          echo "产物：$APK ($(stat -c%s "$APK") 字节)"

          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^uses-permission"

          # 版本号必须是 0.3.0
          echo "$BADGING" | grep -q "versionName='0.3.0'" || { echo "::error::versionName 不是 0.3.0"; exit 1; }

          # 只能有蓝牙两个权限，绝不能有 INTERNET
          PERMS=$(echo "$BADGING" | grep -c "^uses-permission" || true)
          [ "$PERMS" -eq 2 ] || { echo "::error::权限数量应为 2，实际 $PERMS"; exit 1; }
          if echo "$BADGING" | grep -q "android.permission.INTERNET"; then
            echo "::error::APK 不应包含 INTERNET 权限"; exit 1
          fi

          # 体积上限 200 KB，防止依赖或资源被误引入
          SIZE=$(stat -c%s "$APK")
          [ "$SIZE" -lt 204800 ] || { echo "::error::APK 体积 ${SIZE} 字节，超出 200 KB 上限"; exit 1; }

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: LiuguangDrive-apk
          path: build/LiuguangDrive-*.apk
          if-no-files-found: error
          retention-days: 14
