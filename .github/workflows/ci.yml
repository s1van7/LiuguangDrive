name: CI

on:
  push:
    branches: [main, 'feature/**', 'release/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 自检（纯 JVM）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 运行 tests/run.sh
        run: bash tests/run.sh

  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，但只有较新的平台。这里直接用 sdkmanager 补齐
      # android-28 与 build-tools 34.0.0，不依赖第三方 action。
      - name: 安装 platforms;android-28 与 build-tools;34.0.0
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then export ANDROID_HOME=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null \
            || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-28" "build-tools;34.0.0"

          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: 构建（aapt → javac → d8 → zipalign → apksigner）
        env:
          ALLOW_EPHEMERAL_SIGNING: "1"
        run: bash build.sh

      - name: 校验产物
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APK=$(ls build/LiuguangDrive-*.apk | head -1)
          echo "产物：$APK ($(stat -c%s "$APK") 字节)"

          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^uses-permission"

          # 版本号与 build.sh 保持一致，避免升级版本后 CI 仍校验旧版本
          EXPECTED_VERSION=$(grep '^VERSION=' build.sh | head -1 | cut -d '"' -f 2)
          [ -n "$EXPECTED_VERSION" ] || { echo "::error::无法从 build.sh 读取版本号"; exit 1; }
          echo "$BADGING" | grep -q "versionName='$EXPECTED_VERSION'" || { echo "::error::versionName 与 build.sh 不一致，期望 $EXPECTED_VERSION"; exit 1; }
          grep -q 'android:versionCode="6"' AndroidManifest.xml || { echo "::error::versionCode 必须为 6"; exit 1; }
          echo "$BADGING" | grep -q "sdkVersion:'28'" || { echo "::error::minSdk 必须为 28"; exit 1; }
          echo "$BADGING" | grep -q "targetSdkVersion:'28'" || { echo "::error::targetSdk 必须为 28"; exit 1; }

          # 蓝牙 + 可选开机启动权限；绝不能有 INTERNET
          PERMS=$(echo "$BADGING" | grep -c "^uses-permission" || true)
          [ "$PERMS" -eq 3 ] || { echo "::error::权限数量应为 3，实际 $PERMS"; exit 1; }
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q "android.intent.action.BOOT_COMPLETED" || {
            echo "::error::APK 缺少 BOOT_COMPLETED 接收器"; exit 1;
          }
          grep -q 'android:name=".BootReceiver"' AndroidManifest.xml
          grep -q 'android:exported="false"' AndroidManifest.xml || { echo "::error::BootReceiver 必须不可导出"; exit 1; }

          if echo "$BADGING" | grep -q "android.permission.INTERNET"; then
            echo "::error::APK 不应包含 INTERNET 权限"; exit 1
          fi

          # 体积上限 200 KB，防止依赖或资源被误引入
          SIZE=$(stat -c%s "$APK")
          [ "$SIZE" -lt 204800 ] || { echo "::error::APK 体积 ${SIZE} 字节，超出 200 KB 上限"; exit 1; }

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: LiuguangDrive-0.7.0-CI-only
          path: build/LiuguangDrive-*.apk
          if-no-files-found: error
          retention-days: 14
